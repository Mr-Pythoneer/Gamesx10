<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petri — Gamesx10</title>
<meta name="description" content="Stamp Conway-style patterns to seed a living colony that spreads, fights and takes the grid on its own.">
<link rel="stylesheet" href="../../shared/arcade.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='rgb(11,12,15)'/><circle cx='11' cy='12' r='3' fill='rgb(94,242,192)'/><circle cx='21' cy='11' r='2' fill='rgb(94,242,192)'/><circle cx='14' cy='20' r='2.4' fill='rgb(255,77,109)'/><circle cx='22' cy='21' r='3' fill='rgb(255,77,109)'/><circle cx='18' cy='15' r='1.6' fill='rgb(94,242,192)'/></svg>">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a class="back" href="../../index.html">&larr; arcade</a>
    <h1>Petri</h1>
    <span class="tag">seed it, don't steer it</span>
    <span class="spacer"></span>
    <span class="keys"><b>1</b>-<b>6</b> pattern <b>R</b> rotate <b>click</b> stamp</span>
  </div>
  <div class="stage">
    <canvas id="game"></canvas>
  </div>
</div>

<div class="file-warning" id="fileWarn">
  <div class="card">
    <h2>Serve me over http</h2>
    <p>This game uses ES modules, which browsers refuse to load from <code>file://</code>.</p>
    <p>Run <kbd>python3 -m http.server</kbd> in the repo root and open
      <kbd>http://localhost:8000/games/petri/</kbd> — or just play it on GitHub&nbsp;Pages.</p>
  </div>
</div>

<script>
  if (location.protocol === 'file:') document.getElementById('fileWarn').style.display = 'flex';
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
