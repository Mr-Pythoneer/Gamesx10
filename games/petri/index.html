<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petri — Gamesx10</title>
<meta name="description" content="Stamp Conway-style patterns to seed a living colony that spreads, fights and takes the grid on its own.">
<link rel="stylesheet" href="../../shared/arcade.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='rgb(11,12,15)'/><circle cx='11' cy='12' r='3' fill='rgb(94,242,192)'/><circle cx='21' cy='11' r='2' fill='rgb(94,242,192)'/><circle cx='14' cy='20' r='2.4' fill='rgb(255,77,109)'/><circle cx='22' cy='21' r='3' fill='rgb(255,77,109)'/><circle cx='18' cy='15' r='1.6' fill='rgb(94,242,192)'/></svg>">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a class="back" href="../../index.html" data-en="← arcade" data-zh="← 街机厅" data-es="← salón" data-fr="← arcade" data-ja="← アーケード" data-ko="← 아케이드">&larr; arcade</a>
    <h1 data-en="Petri" data-zh="培养皿" data-es="Petri" data-fr="Petri" data-ja="ペトリ" data-ko="페트리">Petri</h1>
    <span class="tag" data-en="seed it, don't steer it" data-zh="播种,而非操控" data-es="siémbralo, no lo dirijas" data-fr="semez-le, ne le pilotez pas" data-ja="種をまけ、操るな" data-ko="씨를 뿌려라, 조종하지 마라">seed it, don't steer it</span>
    <span class="spacer"></span>
    <span class="keys"><b>1</b>-<b>6</b> <span data-en="pattern" data-zh="图案" data-es="patrón" data-fr="motif" data-ja="パターン" data-ko="패턴">pattern</span> <b>R</b> <span data-en="rotate" data-zh="旋转" data-es="rotar" data-fr="pivoter" data-ja="回転" data-ko="회전">rotate</span> <b>click</b> <span data-en="stamp" data-zh="放置" data-es="estampar" data-fr="tamponner" data-ja="刻印" data-ko="찍기">stamp</span></span>
  </div>
  <div class="stage">
    <canvas id="game"></canvas>
  </div>
</div>

<div class="file-warning" id="fileWarn">
  <div class="card">
    <h2>Serve me over http</h2>
    <p>This game uses ES modules, which browsers refuse to load from <code>file://</code>.</p>
    <p>Run <kbd>python3 -m http.server</kbd> in the repo root and open
      <kbd>http://localhost:8000/games/petri/</kbd> — or just play it on GitHub&nbsp;Pages.</p>
  </div>
</div>

<script>
  if (location.protocol === 'file:') document.getElementById('fileWarn').style.display = 'flex';
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
