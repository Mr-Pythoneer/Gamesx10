<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirrorbind — Gamesx10</title>
<meta name="description" content="One set of keys controls two mirrored versions of you at once. Both must get home.">
<link rel="stylesheet" href="../../shared/arcade.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='rgb(11,12,15)'/><path d='M16 4V28' stroke='rgb(60,70,92)' stroke-width='1.5' stroke-dasharray='3 3'/><rect x='4' y='13' width='7' height='12' fill='rgb(255,200,87)'/><rect x='21' y='13' width='7' height='12' fill='rgb(59,167,255)'/></svg>">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a class="back" href="../../index.html" data-en="← arcade" data-zh="← 街机厅" data-es="← recreativa" data-fr="← arcade" data-ja="← アーケード" data-ko="← 오락실">&larr; arcade</a>
    <h1 data-en="Mirrorbind" data-zh="镜绑" data-es="Vínculo Espejo" data-fr="Lien Miroir" data-ja="ミラーバインド" data-ko="미러바인드">Mirrorbind</h1>
    <span class="tag" data-en="one input, two brains" data-zh="一套按键,两个大脑" data-es="una entrada, dos cerebros" data-fr="une entrée, deux cerveaux" data-ja="一つの操作、二つの脳" data-ko="하나의 입력, 두 개의 뇌">one input, two brains</span>
    <span class="spacer"></span>
    <span class="keys"><b>&larr;</b><b>&rarr;</b> <span data-en="move" data-zh="移动" data-es="mover" data-fr="bouger" data-ja="移動" data-ko="이동">move</span> <b>space</b> <span data-en="jump" data-zh="跳跃" data-es="saltar" data-fr="sauter" data-ja="ジャンプ" data-ko="점프">jump</span> <b>R</b> <span data-en="retry" data-zh="重试" data-es="reintentar" data-fr="recommencer" data-ja="リトライ" data-ko="재시도">retry</span></span>
  </div>
  <div class="stage">
    <canvas id="game"></canvas>
  </div>
</div>

<div class="file-warning" id="fileWarn">
  <div class="card">
    <h2>Serve me over http</h2>
    <p>This game uses ES modules, which browsers refuse to load from <code>file://</code>.</p>
    <p>Run <kbd>python3 -m http.server</kbd> in the repo root and open
      <kbd>http://localhost:8000/games/mirrorbind/</kbd> — or just play it on GitHub&nbsp;Pages.</p>
  </div>
</div>

<script>
  if (location.protocol === 'file:') document.getElementById('fileWarn').style.display = 'flex';
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
